services:
  api:
    build: .
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  k6:
    image: grafana/k6:2.3.0
    volumes:
      - ./load:/load
    depends_on:
      - proxy

